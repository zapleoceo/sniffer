name: sniffer

# Изоляция от Веры — контракт из spec-v2.md, раздел 1. Здесь он выглядит так:
# имя проекта sniffer (отсюда сеть sniffer_default и том sniffer_sniffer_pgdata),
# все контейнеры с префиксом sniffer-, порт БД 5434 и только на 127.0.0.1.
# Ни одного общего имени с vera3-* и stepan2-*. То же про 8005 у дашборда:
# порт публикуется на loopback, снаружи ходит nginx.
#
# Потолки памяти (mem_limit) — часть той же изоляции. Машина общая, 3.8 ГБ на
# всех и уже в свопе; процесс, потёкший здесь, без потолка утащил бы за собой
# чужие контейнеры, потому что OOM-killer выбирает жертву по всей машине, а не
# по проекту. Это ПОТОЛКИ, а не резервирование: в норме весь стек живёт в
# 400–600 МБ. Если памяти станет совсем мало — резать worker, он самый жирный.

# Пять процессов отличаются только командой, поэтому образ один и собирается
# один раз: общий якорь с одним image-тегом вместо пяти сборок.
x-app: &app
  build: .
  image: sniffer:local
  env_file: .env
  depends_on:
    postgres: {condition: service_healthy}
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sniffer-postgres
    environment:
      POSTGRES_USER: sniffer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniffer}
      POSTGRES_DB: sniffer
    volumes:
      - sniffer_pgdata:/var/lib/postgresql/data
      - ./infra/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      # 5434, а не 5433: на этой машине 5433 занят vera3-postgres. Спецификация
      # утверждала, что Вера на 5432, и первый же старт на сервере упёрся в
      # "port is already allocated". Занятые соседями порты: 5433 (vera3),
      # 5435 (aibroker). Слушаем только loopback: наружу база не смотрит.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniffer -d sniffer"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Первый старт делает initdb и прогоняет 001_init.sql. На машине,
      # которая уже свопит, это дольше 50 секунд из retries × interval, и без
      # start_period зависимые сервисы стартовать отказывались бы.
      start_period: 40s
    restart: unless-stopped
    mem_limit: ${SNIFFER_MEM_POSTGRES:-384m}
    # Логи Postgres тоже надо ограничивать: диск на этой машине общий с Верой
    # и Степаном, и деплой отменяется при заполнении выше 85%.
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  # Держит MTProto-сессию. Строго один экземпляр: две копии с одной сессией
  # получают от Telegram AuthKeyDuplicated и роняют друг друга.
  collector:
    <<: *app
    container_name: sniffer-collector
    command: python -m sniffer.collector
    mem_limit: ${SNIFFER_MEM_COLLECTOR:-320m}

  # Воронка: гейт → prefilter → извлечение → матчинг. Перезапускается без
  # потерь, состояние живёт в таблице jobs.
  worker:
    <<: *app
    container_name: sniffer-worker
    command: python -m sniffer.worker
    mem_limit: ${SNIFFER_MEM_WORKER:-384m}

  bot:
    <<: *app
    container_name: sniffer-bot
    command: python -m sniffer.bot
    mem_limit: ${SNIFFER_MEM_BOT:-256m}

  # Отдельно от бота: доставка обязана переживать рестарт диалогового
  # процесса, поэтому очередь лежит в outbox, а не в памяти.
  notifier:
    <<: *app
    container_name: sniffer-notifier
    command: python -m sniffer.notifier
    mem_limit: ${SNIFFER_MEM_NOTIFIER:-192m}

  # Веб-интерфейс владельца — docs/dashboard.md. Единственный процесс, который
  # слушает порт.
  dashboard:
    <<: *app
    container_name: sniffer-dashboard
    command: python -m sniffer.dashboard
    ports:
      # ТОЛЬКО 127.0.0.1: снаружи ходит nginx, а не браузер. Опубликуй это на
      # 0.0.0.0 — и страница с перепиской клиентов станет доступна по IP машины
      # в обход TLS и проверки подписи.
      - "127.0.0.1:8005:8005"
    healthcheck:
      # Своя проверка по HTTP: контейнер в состоянии running ещё не значит, что
      # приложение отвечает. Ходим изнутри контейнера — снаружи порт закрыт.
      # Через python, а не curl: в образе его нет, а ставить ради проверки —
      # это лишний слой и лишний пакет.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: ${SNIFFER_MEM_DASHBOARD:-256m}

volumes:
  sniffer_pgdata:
