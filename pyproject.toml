[project]
name = "sniffer"
version = "0.1.0"
description = "Telegram-агент: паспорт запроса, подбор предложений из сообществ, подписка на новые"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "telethon>=1.36",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "structlog>=24.4",
    "aioboto3>=13.2",
    "tzdata>=2024.1",
    "pgvector>=0.3",
    # Веб-интерфейс владельца: FastAPI уже в экосистеме (AIbroker, дашборд
    # Веры), второй веб-фреймворк тащить незачем. python-multipart нужен
    # FastAPI для form-data: без него форма переавторизации отдаёт 500.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    # Fernet для строки сессии юзербота в БД. Единственный секрет проекта,
    # который лежит в хранилище, — и лежать он должен зашифрованным.
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sniffer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
# RUF001-003 — «неоднозначный юникод»: срабатывает на каждой кириллической
# букве. Комментарии и доменные строки здесь по-русски осознанно.
ignore = ["S101", "S104", "S105", "S106", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
