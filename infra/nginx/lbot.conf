# /etc/nginx/sites-enabled/lbot
# Cloudflare проксирует lbot.zapleo.com → сюда на :80 (режим Flexible).
# TLS живёт между клиентом и Cloudflare; Cloudflare↔origin идёт открытым HTTP.
# Это повторяет схему соседних проектов (aib, vera, stepan2) на этой машине.
#
# ВНИМАНИЕ на будущее: интерфейс будет показывать переписку клиентов и расходы.
# До появления там реальных данных режим надо поднять до Full с origin-сертификатом
# Cloudflare — иначе этот трафик идёт по интернету открытым. Записано в
# docs/dashboard.md.

server {
    listen 80;
    server_name lbot.zapleo.com;

    # Настоящий IP клиента приходит от Cloudflare заголовком, иначе в логах
    # будут только адреса самой CF.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;

        # Интерфейса ещё нет. Голая 502 выглядит как поломка, поэтому пока
        # отвечаем честной заглушкой. Когда сервис поднимется на 8005,
        # заглушка перестанет срабатывать сама — править конфиг не придётся.
        error_page 502 504 = @not_yet;
    }

    location @not_yet {
        default_type text/plain; charset utf-8;
        return 200 "SnifferBot: интерфейс ещё не развёрнут.\n";
    }
}
