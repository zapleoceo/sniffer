# /etc/nginx/sites-enabled/lbot
#
# Два блока: 80 для режима Cloudflare Flexible и 8443 для Full.
# для всей зоны сразу: на 80 сюда ходит Flexible, на 443 — Full. Пока
# правило для этого хоста не переведено на Full, работает первый; после —
# второй. Когда Full закрепится, блок на 80 можно свести к редиректу.
#
# Origin-сертификат выписан Cloudflare CA по CSR, сгенерированному НА сервере:
# приватный ключ (/etc/ssl/lbot/lbot.key, права 600) машину не покидал и в
# браузере не показывался. Публичным браузерам этот сертификат не доверяет
# никто — и не должен: снаружи сюда ходит только Cloudflare.
#
# Зонный режим SSL трогать НЕЛЬЗЯ: соседние aib/vera/stepan2 отдают открытый
# HTTP на 80, и перевод всей зоны в Full положил бы их. Режим меняется
# правилом, ограниченным хостом lbot.zapleo.com.

server {
    listen 8443 ssl http2;
    server_name lbot.zapleo.com;

    ssl_certificate     /etc/ssl/lbot/lbot.crt;
    ssl_certificate_key /etc/ssl/lbot/lbot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:lbot:5m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/lbot-common.conf;
}

server {
    listen 80;
    server_name lbot.zapleo.com;

    include /etc/nginx/snippets/lbot-common.conf;
}
