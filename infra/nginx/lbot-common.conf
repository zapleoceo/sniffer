# Общая часть обоих server-блоков lbot.zapleo.com.
# Подключается как /etc/nginx/snippets/lbot-common.conf.
#
# Настоящий адрес клиента приходит от Cloudflare заголовком: без этих строк
# в логах будут только адреса самой CF, и разобрать, кто именно ходил, станет
# невозможно.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

client_max_body_size 4m;

location / {
    proxy_pass http://127.0.0.1:8005;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    # Интерфейса может ещё не быть. Голая 502 читается как поломка, поэтому
    # отвечаем честной заглушкой. Когда сервис поднимется на 8005, заглушка
    # перестанет срабатывать сама — конфиг править не придётся.
    error_page 502 504 = @not_yet;
}

location @not_yet {
    default_type text/plain; charset utf-8;
    return 200 "SnifferBot: интерфейс ещё не развёрнут.\n";
}
